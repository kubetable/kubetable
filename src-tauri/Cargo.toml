[package]
name = "kubetable"
version = "1.0.0"
description = "KubeTable — Kubernetes database browser"
authors = ["you"]
edition = "2021"

[lib]
name = "kubetable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
kube = { version = "0.99", features = ["client", "config", "runtime"] }
k8s-openapi = { version = "0.24", features = ["v1_31"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1.89"
indexmap = "2.14.0"
serde_yaml = "0.9.34"
mysql_async = "0.37"
redis = { version = "0.28", features = ["tokio-comp"] }
mongodb = { version = "3" }
futures-util = "0.3"
base64 = "0.22"
